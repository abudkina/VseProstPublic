<section class="search-filters">
    <div class="top-row">
        <div class="search-trigger-wrap">
            <div class="search-input-desktop">
                <input type="search" placeholder="Найти проблему по названию" id="search" />
            </div>
            <button type="button" class="search-trigger-btn" aria-label="Поиск"><i class="fas fa-search"></i><span class="search-trigger-label">Поиск</span></button>
        </div>
        <a href="/html/add_problem.html" id="addProblem" class="add-problem-link" title="Добавить" aria-label="Добавить"><i class="fas fa-plus"></i><span class="btn-label">Добавить</span></a>
    </div>
    <div class="search-bottom-drawer" id="searchDrawer" aria-hidden="true">
        <div class="search-drawer-backdrop"></div>
        <div class="search-drawer-panel">
            <div class="search-drawer-input-slot"></div>
            <button type="button" class="search-drawer-close" aria-label="Закрыть"><i class="fas fa-times"></i></button>
        </div>
    </div>
    <div class="filters desktop">
        <select id="sort">
            <option value="default">Сортировать</option>
            <option value="popularity">По популярности</option>
            <option value="date">По дате</option>
            <option value="show">По просмотрам</option>
        </select>
        <select id="category">
            <option>Выберите категорию</option>
        </select>
        <select id="hashtags" multiple></select>
        <button id="newBtn">Новые</button> <!-- Добавлена кнопка "Новые" -->
    </div>
</section>

<main>
    <!-- Шаблон карточки (исправлен: закрыты теги) -->
    <template id="card-template">
        <article class="card" data-problem-id="">
            <div class="card-image-wrapper">
                <img src="" alt="" class="card-image" />
                <a href="#" class="card-title-link"></a>
                <div class="card-title-overlay"></div>
                <a href="#" class="card-title-text"></a>
                <div class="card-favorites">
      <i class="fas fa-heart favorite-icon" aria-label="Избранное"></i>
      <span class="favorite-count">0</span>
         </div>
          </div> <!-- Закрыт div -->
            <div class="card-content">
                <div class="problem-topic"></div>
                <div class="tags-column"></div>
                <div class="card-footer">
                    <div class="stat-item views">
                        <div class="stat-icon" title="Просмотры"><i class="fas fa-eye" aria-hidden="true"></i></div>
                        <div class="stat-value"></div>
                    </div>
                    <div class="stat-item comments">
                        <div class="stat-icon" title="Подтверждения"><i class="fas fa-check"></i></div>
                        <div class="stat-value"></div>
                    </div>
                    <div class="stat-item shares">
                        <div class="stat-icon" title="Ссылки"><i class="fas fa-share"></i></div>
                        <div class="stat-value"></div>
                    </div>
                    <div class="stat-item links">
                        <div class="stat-icon" title="Ссылки"><i class="fas fa-link"></i></div>
                        <div class="stat-value"></div>
                    </div>
                </div>
            </div>
        </article>
    </template>

    <div class="cards-container">
        <!-- Здесь будут добавляться карточки -->
    </div>
</main>

<!-- Модальное окно для редактирования проблемы -->
<div id="editModal" class="modal" style="display:none" aria-hidden="true">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Редактировать проблему</h2>
        <form id="editForm" enctype="multipart/form-data">
            <input type="hidden" id="problemId">
            
            <select id="editTopic">
                <option value="" disabled selected>Выберите общую тему</option>
            </select>
            
            <input type="text" id="editName" placeholder="Введите название проблемы" required />
            
            <textarea id="editDescribe" placeholder="Введите описание (необязательно)"></textarea>
            
            <select id="editCategory" required>
                <option value="" disabled selected>Выберите категорию</option>
            </select>
            
            <select id="editHashtags" multiple placeholder="Выберите хэштеги"></select>
            
            <input type="file" id="editImage" accept="image/*" capture="environment" />
            <div id="currentImagePreview" style="margin: 10px 0;"></div>
            
            <div style="display: flex; gap: 20px; margin: 10px 0;">
                <label style="display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" id="editIsNew" />
                    <span>Новая проблема</span>
                </label>
                <label style="display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" id="editFromAuthor" />
                    <span>От автора</span>
                </label>
            </div>
            
            <div id="relatedInfo" style="margin: 10px 0; padding: 10px; background: #f5f5f5; border-radius: 4px;">
                <!-- Для показа связанных данных -->
            </div>
            
            <div class="form-buttons" style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="button" id="clearBtn" class="clear-btn">Очистить</button>
                <button type="button" id="deleteBtn" style="background: #dc3545; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">Удалить</button>
                <button type="submit" class="save-btn">Сохранить</button>
            </div>
        </form>
    </div>
</div>
