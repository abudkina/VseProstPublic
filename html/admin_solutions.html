</head>
<body>
<header>
    <a href="/" class="logo"><img src="/assets/images/logo1-Photoroom1.png" alt="Всё Прост" class="logo-image" /></a>
    <ul class="nav-menu desktop-menu">
        <li><a href="/" title="Вопросы" class="menu-item"><i class="fas fa-question-circle"></i></a></li>
        <li><a href="/html/solutions.html" title="Решения" class="menu-item"><i class="fas fa-lightbulb"></i></a></li>
        <li><a href="/html/favourites.html" title="Избранное" class="menu-item heart" id="favoritesLink"><i class="fas fa-heart"></i></a></li>
        <li><a href="#" title="Корзина" class="menu-item"><i class="fas fa-shopping-basket"></i></a></li>
        <li><a href="/html/notifications.html" title="Уведомления" class="menu-item"><i class="fas fa-bell"></i></a></li>
        <li><a href="/html/profile.html" title="Профиль" class="menu-item" id="profileBtn"><i class="fas fa-user"></i></a></li>
    </ul>
    <ul class="nav-menu mobile-menu">
        <li><a href="/" title="Вопросы" class="menu-item"><i class="fas fa-question-circle"></i></a></li>

        <li><a href="#" title="Корзина" class="menu-item"><i class="fas fa-shopping-basket"></i></a></li>
        <li><a href="/html/notifications.html" title="Уведомления" class="menu-item"><i class="fas fa-bell"></i></a></li>
        <li><a href="/html/profile.html" title="Профиль" class="menu-item"><i class="fas fa-user"></i></a></li>
    </ul>
</header>

<section class="search-filters">
    <div class="top-row">
        <input type="search" placeholder="Найти решение по названию" id="search" />
        <button id="addSolution">Добавить решение</button>
    </div>
    <div class="filters desktop">
        <select id="sort">
            <option value="default">Сортировать</option>
            <option value="popularity">По популярности</option>
            <option value="date">По дате</option>
            <option value="show">По просмотрам</option>
        </select>
        <select id="category">
            <option>Выберите категорию</option>
        </select>
        <button id="newBtn">Новые</button>
    </div>
</section>

<main>
    <template id="card-template">
        <article class="card" data-solution-id="">
            <div class="card-image-wrapper">
                <a href="#" class="card-title-link">
                    <img src="" alt="" class="card-image" />
                </a>
                <div class="card-title-overlay"></div>
                <a href="#" class="card-title-text"></a>
                <div class="card-favorites">
                    <i class="fas fa-heart favorite-icon" aria-label="Избранное"></i>
                    <span class="favorite-count">0</span>
                </div>
            </div>
            <div class="card-content">
                <div class="tags-column"></div>
                <div class="card-footer">
                    <div class="stat-item views">
                        <div class="stat-icon" title="Просмотры"><i class="fas fa-eye" aria-hidden="true"></i></div>
                        <div class="stat-value"></div>
                    </div>
                    <div class="stat-item comments">
                        <div class="stat-icon" title="Комментарии"><i class="fas fa-comment"></i></div>
                        <div class="stat-value"></div>
                    </div>
                    <div class="stat-item shares">
                        <div class="stat-icon" title="Лайки"><i class="fas fa-thumbs-up"></i></div>
                        <div class="stat-value"></div>
                    </div>
                    <div class="stat-item links">
                        <div class="stat-icon" title="Проблемы"><i class="fas fa-link"></i></div>
                        <div class="stat-value"></div>
                    </div>
                </div>
            </div>
        </article>
    </template>

    <div class="cards-container">
        <!-- Здесь будут добавляться карточки -->
    </div>
</main>

<!-- Модальное окно для добавления решения -->
<div id="solution-modal-overlay" class="modal-overlay">
    <div id="solution-modal" class="modal-content">
        <div class="modal-header">
            <h2>Добавить решение</h2>
            <button class="modal-close" id="closeSolutionModal">&times;</button>
        </div>
        <form id="solutionForm">
            <input type="text" id="solution" placeholder="Напишите решение" />
            <textarea id="details" placeholder="Напишите подробности для решения"></textarea>
            
            <div class="problem-search-container">
                <input type="text" id="problemSearch" placeholder="Поиск похожих проблем..." />
                <div id="problemDropdown"></div>
                <div id="selectedProblems"></div>
            </div>

            <div class="file-inputs">
                <input type="file" id="mainImage" accept="image/*" />
                <input type="file" id="additionalImage" accept="image/*" />
            </div>

            <div class="checkbox-group">
                <label><input type="checkbox" id="canBuy" /> Можно ли купить?</label>
                <label><input type="checkbox" id="canEvaluate" /> Можно ли оценить?</label>
            </div>

            <div class="buttons">
                <button type="button" class="clear" id="clearSolutionBtn">Очистить</button>
                <button type="submit" class="save">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<!-- Модальные окна для добавления темы, категории, хэштега -->
<div id="modal-overlay" class="modal-overlay">
    <!-- Модал для темы -->
    <div id="topic-modal" class="modal">
        <h2>Добавить тему</h2>
        <input type="text" id="topic-name-input" placeholder="Введите имя темы">
        <div class="modal-buttons">
            <button id="topic-add-btn">Добавить</button>
            <button id="topic-cancel-btn">Отмена</button>
        </div>
        <div id="topic-error" class="error-message"></div>
    </div>

    <!-- Модал для категории -->
    <div id="category-modal" class="modal">
        <h2>Добавить категорию</h2>
        <input type="text" id="category-name-input" placeholder="Введите имя категории">
        <div class="modal-buttons">
            <button id="category-add-btn">Добавить</button>
            <button id="category-cancel-btn">Отмена</button>
        </div>
        <div id="category-error" class="error-message"></div>
    </div>

    <!-- Модал для хэштега -->
    <div id="hashtag-modal" class="modal">
        <h2>Добавить хэштег</h2>
        <input type="text" id="hashtag-name-input" placeholder="Введите имя хэштега">
        <div class="modal-buttons">
            <button id="hashtag-add-btn">Добавить</button>
            <button id="hashtag-cancel-btn">Отмена</button>
        </div>
        <div id="hashtag-error" class="error-message"></div>
    </div>
</div>

<!-- Модальное окно для редактирования решения -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Редактировать решение</h2>
        <form id="editForm" enctype="multipart/form-data">
            <input type="hidden" id="solutionId">
            
            <input type="text" id="editName" placeholder="Введите название решения" required />
            
            <textarea id="editDescribe" placeholder="Введите описание"></textarea>
            
            <select id="editProblems" multiple placeholder="Выберите связанные проблемы"></select>
            
            <input type="file" id="editImage" accept="image/*" />
            <div id="currentImagePreview" style="margin: 10px 0;"></div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0;">
                <label>
                    Цена: <input type="number" id="editPrice" step="0.01" min="0" />
                </label>
                <label>
                    Эффективность: <input type="number" id="editEfficiency" min="0" max="100" />
                </label>
                <label>
                    Сложность: <input type="number" id="editComplexity" min="0" max="100" />
                </label>
                <label>
                    Время: <input type="number" id="editTime" min="0" />
                </label>
            </div>
            
            <div style="display: flex; gap: 20px; margin: 10px 0;">
                <label style="display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" id="editIsNew" />
                    <span>Новое решение</span>
                </label>
                <label style="display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" id="editFromAuthor" />
                    <span>От автора</span>
                </label>
                <label style="display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" id="editIsBought" />
                    <span>Можно купить</span>
                </label>
                <label style="display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" id="editIsRating" />
                    <span>Можно оценить</span>
                </label>
            </div>
            
            <div id="relatedInfo" style="margin: 10px 0; padding: 10px; background: #f5f5f5; border-radius: 4px;">
                <!-- Для показа связанных данных -->
            </div>
            
            <div class="form-buttons" style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="button" id="clearBtn" class="clear-btn">Очистить</button>
                <button type="button" id="deleteBtn" style="background: #dc3545; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">Удалить</button>
                <button type="submit" class="save-btn">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<script src="/js/config.js"></script>
<script type="module" src="/js/admin_solutions.js"></script>
<script type="module" src="/js/logoAdmin.js"></script>
<script type="module" src="/js/modalSolution.js"></script>
</body>
</html>
