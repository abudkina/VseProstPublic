<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Всё Прост</title>
    <link rel="stylesheet" href="../css/favourites.css" />
    <link rel="stylesheet" href="../css/header.css" />
     <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>
</head>
<body>
<header>
    <div class="logo">Всё Прoст</div>
    <nav class="desktop-menu">
        <a href="#" title="Вопросы" class="menu-item">
            <img src="../assets/icons/help_6176358.png" alt="" /> Вопросы
        </a>
        <a href="#" title="Решения" class="menu-item">
            <img src="../assets/icons/idea_17401118.png" alt="" /> Решения
        </a>
        <a href="#" title="Избранное" class="menu-item heart" id="favoritesLink">
            <img src="../assets/icons/hearts_8822941.png" alt="" /> Избранное
        </a>
        <a href="#" title="Корзина" class="menu-item">
            <img src="../assets/icons/shopping-basket_11981486.png" alt="" /> Корзина
        </a>
        <a href="#" title="Уведомления" class="menu-item">
            <img src="../assets/icons/notification_5951646.png" alt="" /> Уведомления
        </a>
        <a href="#" title="Профиль" class="menu-item" id="profileBtn">
            <img src="../assets/icons/user-list_18357678.png" alt="" /> Профиль
        </a>
    </nav>
</header>

<section class="search-filters">
    <div class="top-row">
        <input type="search" placeholder="Найти проблему по названию" id="search" />
        <button id="addProblem">Добавить проблему</button>
    </div>
    <div class="filters desktop">
        <select id="sort">
            <option value="default">Сортировать</option>
            <option value="popularity">По популярности</option>
            <option value="date">По дате</option>
            <option value="show">По просмотрам</option>
        </select>
        <select id="category">
            <option>Выберите категорию</option>
        </select>
        <select id="hashtags" multiple></select>
    </div>
</section>

<main>
    <!-- Шаблон карточки вынесен вне контейнера -->
    <template id="card-template">
        <article class="card">
            <div class="card-image-wrapper">
                 <a href="#" class="card-title-link">
                <img src="" alt="" class="card-image" />
                </a>
             <div class="card-title-overlay"></div>
            <a href="#" class="card-title-text"></a>
            <div class="card-favorites">
      <img src="../assets/icons/love_9318199.png" alt="Избранное" class="favorite-icon" />
      <span class="favorite-count">0</span>
         </div>
          </div>
           </div>
            <div class="card-content">
                <div class="tags-column"></div>
                <div class="card-footer">
                    <div class="stat-item views">
                        <div class="stat-icon" title="Просмотры"><img src="../assets/icons/eye_8979989.png" alt="Просмотры"/></div>
                        <div class="stat-value"></div>
                    </div>
                    <div class="stat-item comments">
                        <div class="stat-icon" title="Подтверждения"><img src="../assets/icons/check-mark_3906842.png" alt="Подтверждения" /></div>
                        <div class="stat-value"></div>
                    </div>
                    <div class="stat-item shares">
                        <div class="stat-icon" title="Поделились"><img src="../assets/icons/reply_17222221.png" alt="Ссылки" /></div>
                        <div class="stat-value"></div>
                    </div>
                    <div class="stat-item links">
                        <div class="stat-icon" title="Ссылки"><img src="../assets/icons/link_13925097.png" alt="Ссылки" /></div>
                        <div class="stat-value"></div>
                    </div>
                </div>
            </div>
        </article>
    </template>

    <div class="cards-container">
        <!-- Здесь будут добавляться карточки -->
    </div>
</main>
<script type="module" src="../js/favourites.js" defer></script>
</body>
</html>
