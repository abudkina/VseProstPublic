<div id="solutionContainer"></div>

    <!-- Модальное окно для добавления решения -->
    <div id="solution-modal-overlay" class="modal-overlay">
        <div id="solution-modal" class="modal-content">
            <div class="modal-header">
                <h2>Добавить решение</h2>
                <button class="modal-close" id="closeSolutionModal">&times;</button>
            </div>
            <form id="solutionForm">
                <input type="text" id="solution" placeholder="Напишите решение" />
                <textarea id="details" placeholder="Напишите подробности для решения"></textarea>
                
                <div class="problem-search-container">
                    <input type="text" id="problemSearch" placeholder="Поиск похожих проблем..." />
                    <div id="problemDropdown"></div>
                    <div id="selectedProblems"></div>
                </div>

                <div class="file-inputs">
                    <input type="file" id="mainImage" accept="image/*" />
                    <input type="file" id="additionalImage" accept="image/*" />
                </div>

                <div class="checkbox-group">
                    <label><input type="checkbox" id="canBuy" /> Можно ли купить?</label>
                    <label><input type="checkbox" id="canEvaluate" /> Можно ли оценить?</label>
                </div>

                <div class="buttons">
                    <button type="button" class="clear" id="clearSolutionBtn">Очистить</button>
                    <button type="submit" class="save">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Модальное окно для добавления похожей проблемы -->
    <div id="linked-problem-modal-overlay" class="modal-overlay">
        <div id="linked-problem-modal" class="modal-content">
            <div class="modal-header">
                <h2>Добавить похожую проблему</h2>
                <button class="modal-close" id="closeLinkedProblemModal">&times;</button>
            </div>
            <div class="linked-problem-search-container">
                <input type="text" id="linkedProblemSearch" placeholder="Начните вводить название проблемы (минимум 2 символа)..." />
                <div id="linkedProblemDropdown" class="problem-dropdown"></div>
                <div id="selectedLinkedProblems" class="selected-problems-list"></div>
            </div>
            <div class="buttons">
                <button type="button" class="clear" id="clearLinkedProblemBtn">Очистить</button>
                <button type="button" class="save" id="saveLinkedProblemBtn">Добавить</button>
            </div>
        </div>
    </div>

    <!-- Шаблоны -->
    <template id="problem-info-template">
        <div class="problem-info">
            <img class="problem-img" alt="" />
            <h2 class="problem-title"></h2>
            <div class="problem-stats">
                <span class="stat-item" title="Лайки">
                    <img src="/assets/icons/love_9318199.png" alt="Лайки" class="icon" />
                    <span class="stat-number">10</span>
                </span>
                <span class="stat-item" title="Просмотры">
                    <img src="/assets/icons/eye_8979989.png" alt="Просмотры" class="icon" />
                    <span class="stat-number">50</span>
                </span>
                <span class="stat-item" title="Ссылки">
                    <img src="/assets/icons/link_13925097.png" alt="Ссылки" class="icon" />
                    <span class="stat-number">5</span>
                </span>
            </div>
        </div>
    </template>

    <template id="tag-template">
        <span class="tag"></span>
    </template>

    <template id="solution-card-template">
        <article class="card">
            <div class="card-image-wrapper">
                <a href="#" class="card-title-link">
                    <img src="" alt="" class="card-image" />
                </a>
                <div class="card-title-overlay"></div>
                <a href="#" class="card-title-text"></a>
                <div class="card-favorites">
                    <img src="/assets/icons/love_9318199.png" alt="Избранное" class="favorite-icon" />
                    <span class="favorite-count">0</span>
                </div>
                <button class="card-cart-btn" title="Добавить в корзину">
                    <img src="/assets/icons/shopping-bag_7945129.png" alt="В корзину" />
                </button>
                <div class="rating">
                    <span class="rating-number">0</span>
                </div>
            </div>
            <div class="card-content">
                <div class="problem-topic"></div>
                <div class="tags-column"></div>
                <div class="card-footer">
                    <div class="stat-item views">
                        <div class="stat-icon" title="Просмотры"><img src="/assets/icons/eye_8979989.png" alt="Просмотры"/></div>
                        <div class="stat-value"></div>
                    </div>
                    <div class="stat-item comments">
                        <div class="stat-icon" title="Подтверждения"><img src="/assets/icons/check-mark_3906842.png" alt="Подтверждения" /></div>
                        <div class="stat-value"></div>
                    </div>
                    <div class="stat-item shares">
                        <div class="stat-icon" title="Ссылки"><img src="/assets/icons/link_13925097.png" alt="Ссылки" /></div>
                        <div class="stat-value"></div>
                    </div>
                    <div class="stat-item links">
                        <div class="stat-icon" title="Линки"><img src="/assets/icons/link_13925097.png" alt="Линки" /></div>
                        <div class="stat-value"></div>
                    </div>
                </div>
            </div>
        </article>
    </template>
